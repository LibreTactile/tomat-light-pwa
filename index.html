<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomat Light</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tomat Light">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📳</text></svg>">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%231a1a2e'/><text x='90' y='130' font-size='90' text-anchor='middle' fill='white'>📳</text></svg>">

    <!-- Web App Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="background-animation"></div>

    <div class="container">
        <div class="header-line">
            <h1 class="title">Tomat Light PWA 0.4</h1>
            <!-- WebRTC Connection Status -->
            <div class="connection-status" id="connectionStatus">
                <span class="status-indicator" id="statusIndicator">⚫</span>
                <span class="status-text" id="statusText">Connecting...</span>
                <span class="status-details" id="statusDetails"></span>
            </div>
        </div>

        <!-- Main UI Container -->
        <div class="tomat-ui" id="tomatUI">
            <!-- Element Rows -->
            <div class="element-rows">
                <!-- Row 1 -->
                <div class="ui-row" data-row="1">
                    <button class="h-btn" data-haptic="true" data-input="h1">h1</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h2">h2</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h3">h3</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h4">h4</button>
                    <div class="v-separator-large"></div>
                    <button class="enter-btn" data-haptic="true" data-input="enter">↵</button>
                </div>

                <!-- Row 2 -->
                <div class="ui-row" data-row="2">
                    <button class="h-btn" data-haptic="true" data-input="h1">h1</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h2">h2</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h3">h3</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h4">h4</button>
                    <div class="v-separator-large"></div>
                    <button class="enter-btn" data-haptic="true" data-input="enter">↵</button>
                </div>

                <!-- Row 3 -->
                <div class="ui-row" data-row="3">
                    <button class="h-btn" data-haptic="true" data-input="h1">h1</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h2">h2</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h3">h3</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h4">h4</button>
                    <div class="v-separator-large"></div>
                    <button class="enter-btn" data-haptic="true" data-input="enter">↵</button>
                </div>

                <!-- Row 4 -->
                <div class="ui-row" data-row="4">
                    <button class="h-btn" data-haptic="true" data-input="h1">h1</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h2">h2</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h3">h3</button>
                    <div class="v-separator"></div>
                    <button class="h-btn" data-haptic="true" data-input="h4">h4</button>
                    <div class="v-separator-large"></div>
                    <button class="enter-btn" data-haptic="true" data-input="enter">↵</button>
                </div>
            </div>

            <!-- Nav Buttons -->
            <div class="nav-buttons">
                <button class="nav-btn" data-input="F" data-haptic="true">*</button>
                <button class="nav-btn" data-input="P" data-haptic="true">+</button>
                <button class="nav-btn" data-input="M" data-haptic="true">-</button>
                <button class="nav-btn" data-input="U" data-haptic="true">/\</button>
                <button class="nav-btn" data-input="D" data-haptic="true">\/</button>
                <button class="nav-btn" data-input="N" data-haptic="true">&gt;</button>
            </div>
        </div>
    </div>

    <div id="messageLog" class="message-log">Waiting for messages...</div>


    <div class="debug-info" id="debugInfo">
        <div id="debugContent"></div>
        <button class="control-button test-btn" id="testVibrateBtn"
            style="width: 100%; margin-top: 1rem; background: #e94560;">🔥 Test Physical Vibration (1s)</button>
    </div>

    <div class="install-prompt" id="installPrompt">
        <h3 style="margin-bottom: 1rem;">Install Vibration PWA</h3>
        <p style="margin-bottom: 1rem; opacity: 0.8;">Add this app to your home screen for the best experience!</p>
        <button class="install-button" id="installBtn">Install App</button>
        <button class="close-button" id="closeBtn">Maybe Later</button>
    </div>

    <div class="service-worker-status" id="swStatus"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <!-- JavaScript Modules -->
    <script src="./js/utils.js"></script>
    <script src="./js/signaling-manager.js"></script>
    <script src="./js/webrtc-manager.js"></script>
    <script src="./js/vibration-handler.js"></script>
    <script src="./js/tomat-navi-io.js"></script>
    <script src="./js/pwa-manager.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
